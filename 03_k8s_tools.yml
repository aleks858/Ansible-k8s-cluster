---
- name: Установка kubelet, kubeadm, kubectl
  hosts: k8s_cluster
  become: yes
  gather_facts: yes
  tasks:

    - name: Добавить GPG-ключ Kubernetes
      apt_key:
        url: https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key
        state: present

    - name: Добавить репозиторий Kubernetes
      apt_repository:
        repo: "deb https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /"
        state: present
        update_cache: yes

    - name: Установить kubelet, kubeadm, kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes

    - name: Зафиксировать версии
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Запустить kubelet
      systemd:
        name: kubelet
        state: started
        enabled: yes

    - name: Проверить версию kubeadm
      command: kubeadm version -o short
      register: kubeadm_version
      changed_when: false

    - name: Показать версию
      debug:
        msg: "kubeadm: {{ kubeadm_version.stdout }}"
